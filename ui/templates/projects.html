{% extends "base.html" %}

{% block title %}Projects - CodeObit{% endblock %}

{% block content %}
<div class="row">
    <div class="col-12">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h1 class="h2 mb-1">
                    <i class="fas fa-folder-open text-primary me-2"></i>
                    Project Management
                </h1>
                <p class="text-muted mb-0">Organize and manage your development projects</p>
            </div>
            <div class="d-flex gap-2">
                <button class="btn btn-outline-primary" onclick="refreshProjects()">
                    <i class="fas fa-sync-alt me-1"></i>Refresh
                </button>
                <button class="btn btn-primary" onclick="createProject()">
                    <i class="fas fa-plus me-1"></i>New Project
                </button>
            </div>
        </div>
    </div>
</div>

<!-- Project Filters -->
<div class="row mb-4">
    <div class="col-12">
        <div class="card bg-dark border-secondary">
            <div class="card-body">
                <div class="row align-items-center">
                    <div class="col-md-4">
                        <input type="text" class="form-control bg-dark border-secondary text-light" 
                               id="project-search" placeholder="Search projects...">
                    </div>
                    <div class="col-md-3">
                        <select class="form-select bg-dark border-secondary text-light" id="project-type-filter">
                            <option value="">All Types</option>
                            <option value="general">General</option>
                            <option value="web">Web Application</option>
                            <option value="api">API/Backend</option>
                            <option value="mobile">Mobile App</option>
                            <option value="ml">Machine Learning</option>
                            <option value="game">Game Development</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <select class="form-select bg-dark border-secondary text-light" id="project-sort">
                            <option value="name">Sort by Name</option>
                            <option value="created">Sort by Created</option>
                            <option value="modified">Sort by Modified</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <div class="btn-group w-100" role="group">
                            <button type="button" class="btn btn-outline-secondary active" id="grid-view">
                                <i class="fas fa-th"></i>
                            </button>
                            <button type="button" class="btn btn-outline-secondary" id="list-view">
                                <i class="fas fa-list"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Projects Container -->
<div class="row" id="projects-container">
    <div class="col-12">
        <div class="text-center text-muted py-5">
            <i class="fas fa-spinner fa-spin fa-2x mb-3"></i>
            <div>Loading projects...</div>
        </div>
    </div>
</div>

<!-- Create Project Modal -->
<div class="modal fade" id="createProjectModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content bg-dark">
            <div class="modal-header border-secondary">
                <h5 class="modal-title">
                    <i class="fas fa-plus me-2"></i>Create New Project
                </h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="createProjectForm">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="projectName" class="form-label">Project Name</label>
                            <input type="text" class="form-control bg-dark border-secondary text-light" 
                                   id="projectName" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="projectType" class="form-label">Project Type</label>
                            <select class="form-select bg-dark border-secondary text-light" id="projectType">
                                <option value="general">General</option>
                                <option value="web">Web Application</option>
                                <option value="api">API/Backend</option>
                                <option value="mobile">Mobile App</option>
                                <option value="ml">Machine Learning</option>
                                <option value="game">Game Development</option>
                            </select>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="projectDescription" class="form-label">Description</label>
                        <textarea class="form-control bg-dark border-secondary text-light" 
                                  id="projectDescription" rows="3"></textarea>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="projectTemplate" class="form-label">Template</label>
                            <select class="form-select bg-dark border-secondary text-light" id="projectTemplate">
                                <option value="">None</option>
                                <option value="python">Python Project</option>
                                <option value="javascript">JavaScript Project</option>
                                <option value="react">React App</option>
                                <option value="flask">Flask API</option>
                                <option value="django">Django Project</option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="projectLocation" class="form-label">Location</label>
                            <input type="text" class="form-control bg-dark border-secondary text-light" 
                                   id="projectLocation" placeholder="projects/" readonly>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer border-secondary">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" onclick="submitCreateProject()">Create Project</button>
            </div>
        </div>
    </div>
</div>

<!-- Project Details Modal -->
<div class="modal fade" id="projectDetailsModal" tabindex="-1">
    <div class="modal-dialog modal-xl">
        <div class="modal-content bg-dark">
            <div class="modal-header border-secondary">
                <h5 class="modal-title">
                    <i class="fas fa-folder-open me-2"></i>
                    <span id="project-details-name">Project Details</span>
                </h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div id="project-details-content">
                    <!-- Project details will be loaded here -->
                </div>
            </div>
            <div class="modal-footer border-secondary">
                <button type="button" class="btn btn-outline-danger" onclick="deleteCurrentProject()">
                    <i class="fas fa-trash me-1"></i>Delete
                </button>
                <button type="button" class="btn btn-outline-primary" onclick="openProjectInExplorer()">
                    <i class="fas fa-external-link-alt me-1"></i>Open in Explorer
                </button>
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
let projects = [];
let currentProject = null;
let viewMode = 'grid';

document.addEventListener('DOMContentLoaded', function() {
    loadProjects();
    setupEventListeners();
});

function setupEventListeners() {
    // Search functionality
    document.getElementById('project-search').addEventListener('input', filterProjects);
    document.getElementById('project-type-filter').addEventListener('change', filterProjects);
    document.getElementById('project-sort').addEventListener('change', sortProjects);
    
    // View mode buttons
    document.getElementById('grid-view').addEventListener('click', () => setViewMode('grid'));
    document.getElementById('list-view').addEventListener('click', () => setViewMode('list'));
}

function loadProjects() {
    showLoading(true);
    
    fetch('/api/projects')
        .then(response => response.json())
        .then(data => {
            projects = data.projects || [];
            displayProjects(projects);
        })
        .catch(error => {
            console.error('Error loading projects:', error);
            showError('Failed to load projects');
        })
        .finally(() => {
            showLoading(false);
        });
}

function displayProjects(projectList) {
    const container = document.getElementById('projects-container');
    
    if (projectList.length === 0) {
        container.innerHTML = `
            <div class="col-12">
                <div class="text-center text-muted py-5">
                    <i class="fas fa-folder-plus fa-3x mb-3"></i>
                    <h4>No Projects Found</h4>
                    <p>Create your first project to get started!</p>
                    <button class="btn btn-primary" onclick="createProject()">
                        <i class="fas fa-plus me-1"></i>Create Project
                    </button>
                </div>
            </div>
        `;
        return;
    }
    
    if (viewMode === 'grid') {
        displayProjectsGrid(projectList);
    } else {
        displayProjectsList(projectList);
    }
}

function displayProjectsGrid(projectList) {
    const container = document.getElementById('projects-container');
    container.innerHTML = projectList.map(project => `
        <div class="col-md-6 col-lg-4 mb-4">
            <div class="card bg-dark border-secondary h-100 project-card" onclick="showProjectDetails('${project.name}')">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-start mb-3">
                        <div class="project-icon">
                            <i class="fas ${getProjectIcon(project.type)} fa-2x text-primary"></i>
                        </div>
                        <div class="dropdown">
                            <button class="btn btn-sm btn-outline-secondary" type="button" data-bs-toggle="dropdown" onclick="event.stopPropagation()">
                                <i class="fas fa-ellipsis-v"></i>
                            </button>
                            <ul class="dropdown-menu dropdown-menu-dark">
                                <li><a class="dropdown-item" href="#" onclick="openProject('${project.name}')">
                                    <i class="fas fa-external-link-alt me-2"></i>Open
                                </a></li>
                                <li><a class="dropdown-item" href="#" onclick="duplicateProject('${project.name}')">
                                    <i class="fas fa-copy me-2"></i>Duplicate
                                </a></li>
                                <li><hr class="dropdown-divider"></li>
                                <li><a class="dropdown-item text-danger" href="#" onclick="deleteProject('${project.name}')">
                                    <i class="fas fa-trash me-2"></i>Delete
                                </a></li>
                            </ul>
                        </div>
                    </div>
                    <h5 class="card-title">${project.name}</h5>
                    <p class="card-text text-muted small">${project.type || 'General'}</p>
                    <div class="card-text small text-muted">
                        <i class="fas fa-calendar me-1"></i>
                        Created ${new Date(project.created * 1000).toLocaleDateString()}
                    </div>
                </div>
                <div class="card-footer bg-transparent border-secondary">
                    <div class="d-flex justify-content-between align-items-center">
                        <small class="text-muted">
                            <i class="fas fa-folder me-1"></i>
                            ${project.path}
                        </small>
                        <i class="fas fa-chevron-right text-muted"></i>
                    </div>
                </div>
            </div>
        </div>
    `).join('');
}

function displayProjectsList(projectList) {
    const container = document.getElementById('projects-container');
    container.innerHTML = `
        <div class="col-12">
            <div class="card bg-dark border-secondary">
                <div class="table-responsive">
                    <table class="table table-dark table-hover mb-0">
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Type</th>
                                <th>Created</th>
                                <th>Location</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${projectList.map(project => `
                                <tr onclick="showProjectDetails('${project.name}')" style="cursor: pointer;">
                                    <td>
                                        <div class="d-flex align-items-center">
                                            <i class="fas ${getProjectIcon(project.type)} me-2 text-primary"></i>
                                            <span class="fw-bold">${project.name}</span>
                                        </div>
                                    </td>
                                    <td><span class="badge bg-secondary">${project.type || 'General'}</span></td>
                                    <td>${new Date(project.created * 1000).toLocaleDateString()}</td>
                                    <td><code class="small">${project.path}</code></td>
                                    <td onclick="event.stopPropagation()">
                                        <div class="btn-group">
                                            <button class="btn btn-sm btn-outline-primary" onclick="openProject('${project.name}')">
                                                <i class="fas fa-external-link-alt"></i>
                                            </button>
                                            <button class="btn btn-sm btn-outline-danger" onclick="deleteProject('${project.name}')">
                                                <i class="fas fa-trash"></i>
                                            </button>
                                        </div>
                                    </td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    `;
}

function getProjectIcon(type) {
    switch (type) {
        case 'web': return 'fa-globe';
        case 'api': return 'fa-server';
        case 'mobile': return 'fa-mobile-alt';
        case 'ml': return 'fa-brain';
        case 'game': return 'fa-gamepad';
        default: return 'fa-folder';
    }
}

function setViewMode(mode) {
    viewMode = mode;
    
    // Update button states
    document.getElementById('grid-view').classList.toggle('active', mode === 'grid');
    document.getElementById('list-view').classList.toggle('active', mode === 'list');
    
    displayProjects(projects);
}

function filterProjects() {
    const searchTerm = document.getElementById('project-search').value.toLowerCase();
    const typeFilter = document.getElementById('project-type-filter').value;
    
    let filtered = projects.filter(project => {
        const matchesSearch = project.name.toLowerCase().includes(searchTerm);
        const matchesType = !typeFilter || project.type === typeFilter;
        return matchesSearch && matchesType;
    });
    
    displayProjects(filtered);
}

function sortProjects() {
    const sortBy = document.getElementById('project-sort').value;
    
    const sorted = [...projects].sort((a, b) => {
        switch (sortBy) {
            case 'name':
                return a.name.localeCompare(b.name);
            case 'created':
                return b.created - a.created;
            case 'modified':
                return (b.modified || b.created) - (a.modified || a.created);
            default:
                return 0;
        }
    });
    
    displayProjects(sorted);
}

function createProject() {
    const modal = new bootstrap.Modal(document.getElementById('createProjectModal'));
    modal.show();
}

function submitCreateProject() {
    const name = document.getElementById('projectName').value;
    const type = document.getElementById('projectType').value;
    const description = document.getElementById('projectDescription').value;
    const template = document.getElementById('projectTemplate').value;
    
    if (!name) {
        showToast('Please enter a project name', 'warning');
        return;
    }
    
    showLoading(true);
    
    fetch('/api/projects', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
        },
        body: JSON.stringify({ 
            name, 
            type, 
            description, 
            template 
        })
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            const modal = bootstrap.Modal.getInstance(document.getElementById('createProjectModal'));
            modal.hide();
            document.getElementById('createProjectForm').reset();
            loadProjects();
            showToast('Project created successfully!', 'success');
        } else {
            showToast(data.error || 'Failed to create project', 'danger');
        }
    })
    .catch(error => {
        console.error('Error creating project:', error);
        showToast('Error creating project', 'danger');
    })
    .finally(() => {
        showLoading(false);
    });
}

function showProjectDetails(projectName) {
    currentProject = projects.find(p => p.name === projectName);
    if (!currentProject) return;
    
    document.getElementById('project-details-name').textContent = currentProject.name;
    
    const content = document.getElementById('project-details-content');
    content.innerHTML = `
        <div class="row">
            <div class="col-md-8">
                <h6>Project Information</h6>
                <table class="table table-dark table-sm">
                    <tr><td><strong>Name:</strong></td><td>${currentProject.name}</td></tr>
                    <tr><td><strong>Type:</strong></td><td><span class="badge bg-secondary">${currentProject.type || 'General'}</span></td></tr>
                    <tr><td><strong>Location:</strong></td><td><code>${currentProject.path}</code></td></tr>
                    <tr><td><strong>Created:</strong></td><td>${new Date(currentProject.created * 1000).toLocaleString()}</td></tr>
                </table>
                
                <h6 class="mt-4">Recent Files</h6>
                <div class="border border-secondary rounded p-3">
                    <div class="text-muted">Loading files...</div>
                </div>
            </div>
            <div class="col-md-4">
                <h6>Quick Actions</h6>
                <div class="d-grid gap-2">
                    <button class="btn btn-primary" onclick="openProject('${currentProject.name}')">
                        <i class="fas fa-external-link-alt me-1"></i>Open Project
                    </button>
                    <button class="btn btn-outline-primary" onclick="openInChat('${currentProject.name}')">
                        <i class="fas fa-comments me-1"></i>Chat about Project
                    </button>
                    <button class="btn btn-outline-info" onclick="exportProject('${currentProject.name}')">
                        <i class="fas fa-download me-1"></i>Export Project
                    </button>
                </div>
                
                <h6 class="mt-4">Project Stats</h6>
                <div class="small text-muted">
                    <div>Files: <span class="text-light">-</span></div>
                    <div>Size: <span class="text-light">-</span></div>
                    <div>Last Modified: <span class="text-light">-</span></div>
                </div>
            </div>
        </div>
    `;
    
    const modal = new bootstrap.Modal(document.getElementById('projectDetailsModal'));
    modal.show();
}

function refreshProjects() {
    loadProjects();
    showToast('Projects refreshed', 'success');
}

function openProject(projectName) {
    // This would open the project in the file explorer or IDE
    showToast(`Opening project: ${projectName}`, 'info');
    window.location.href = `/files?project=${encodeURIComponent(projectName)}`;
}

function deleteProject(projectName) {
    if (confirm(`Are you sure you want to delete the project "${projectName}"? This action cannot be undone.`)) {
        showToast('Project deletion not implemented yet', 'warning');
    }
}

function duplicateProject(projectName) {
    showToast('Project duplication not implemented yet', 'info');
}

function openInChat(projectName) {
    window.location.href = `/chat?project=${encodeURIComponent(projectName)}`;
}

function exportProject(projectName) {
    showToast('Project export not implemented yet', 'info');
}

function showError(message) {
    document.getElementById('projects-container').innerHTML = `
        <div class="col-12">
            <div class="text-center text-danger py-5">
                <i class="fas fa-exclamation-triangle fa-3x mb-3"></i>
                <h4>Error</h4>
                <p>${message}</p>
                <button class="btn btn-outline-primary" onclick="loadProjects()">
                    <i class="fas fa-sync-alt me-1"></i>Retry
                </button>
            </div>
        </div>
    `;
}
</script>
{% endblock %}
